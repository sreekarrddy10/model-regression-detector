[project]
name = "mrd"
version = "0.1.0"
description = "Model Regression Detection System - CI/CD for LLM behavior"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
providers = [
    "openai>=1.40",
    "anthropic>=0.34",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.11",
    "bandit>=1.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mrd"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "unit: offline tests, no network, cassette-backed",
    "integration: requires live provider API keys",
]
addopts = "-q --strict-markers"

[tool.coverage.run]
source = ["src/mrd"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "T20"]  # T20 bans print()

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["T20"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["mrd"]

[[tool.mypy.overrides]]
module = ["openai.*", "anthropic.*", "yaml.*", "dotenv.*"]
ignore_missing_imports = true
