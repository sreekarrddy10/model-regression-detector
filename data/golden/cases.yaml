# Golden dataset — authoring surface.
#
# Write cases here, then compile:  make dataset-build
#
# This YAML is what you edit; data/golden/emails.jsonl is generated from it and
# is the canonical, hashed artifact. Both are committed.
#
# Fields you write:
#   input_email        the email, verbatim. Use a `|` block scalar for anything
#                      multi-line — no escaping, real line breaks.
#   expected_category  billing | technical | account | general
#   expected_summary   one sentence, customer's point of view, under 25 words
#   difficulty         easy | ambiguous | adversarial
#   notes              why this case exists. Required. Write it for whoever
#                      debugs the failure in six months.
#   critical           optional, default false. true = a regression here blocks
#                      the merge on its own. Reserve it for behaviour that must
#                      never break.
#
# Assigned for you:
#   id                 the next free tc_NNNN, unless you set one explicitly
#   added_at           stamped on first build, then carried over — so rebuilding
#                      never churns the dataset hash
#   source             defaults to handwritten; use from_failure for cases
#                      harvested from a production failure
#
# Shape of an entry:
#
#   - input_email: |
#       Hi — we were charged twice for September (INV-4471 and INV-4472).
#
#       Can you refund the duplicate?
#     expected_category: billing
#     expected_summary: Customer was charged twice in September and wants the duplicate refunded.
#     difficulty: easy
#     critical: true
#     notes: Core billing path. If duplicate-charge refunds misroute, money is at stake.
#
# Do NOT generate these with an LLM. A model-generated golden set measures
# whether the model agrees with itself. See AUTHORING.md.
#
# `make dataset-report` names the three scarcest strata each time you rebuild.

